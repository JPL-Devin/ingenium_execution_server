name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ./image
        run: |
          python -m pip install --upgrade pip
          # Strip JPL-internal index URL (unreachable from GitHub Actions) and
          # redis line (installed separately to avoid PyJWT version conflict)
          sed -e '/extra-index-url/d' -e '/^redis/d' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-test.txt
          # redis 5.3.0 declares PyJWT~=2.9.0 but this project pins PyJWT==2.12.1;
          # the PyJWT dep is only needed for Redis JWT auth which is unused here
          pip install --no-deps redis==5.3.0

      - name: Run tests
        working-directory: ./image
        run: pytest --cov=. --cov-report=xml --cov-report=html -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: image/htmlcov/
